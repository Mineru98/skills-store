name: Content guard

on:
  pull_request:
  push:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan refs for blocked legacy traces
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          def hx(value):
              return bytes.fromhex(value).decode('utf-8')

          blocked = [
              hx('676e75626f617264'),
              hx('67726e75626f61726435').replace('gr', 'g'),
              hx('eab7b8eb8884ebb3b4eb939c'),
              hx('44455349474e2e6d64'),
              hx('64657369676e') + r'[-_ ]?' + hx('73797374656d') + 's?',
              hx('eb9494ec9e90ec9db820ec8b9cec8aa4ed859c'),
              hx('64657369676e') + r'[-_ ]?' + hx('746f6b656e') + 's?',
              hx('eb9494ec9e90ec9db820ed86a0ed81b0'),
              hx('64657369676e') + r'[-_]?' + hx('6d64'),
              hx('6d616b65') + r'[-_]?' + hx('64657369676e') + r'[-_]?' + hx('6d64'),
              hx('6f70656e') + r'[-_]?' + hx('64657369676e'),
              '@' + hx('676f6f676c65') + '/' + hx('64657369676e') + r'\.' + hx('6d64'),
          ]
          rx = re.compile('|'.join(blocked), re.IGNORECASE)

          def git(*args):
              return subprocess.run(['git', *args], check=True, text=True, stdout=subprocess.PIPE).stdout

          failures = []

          log = git('log', '--all', '--format=%H%x00%s%n%b%x00END')
          if rx.search(log):
              failures.append('commit metadata')

          revs = git('rev-list', '--all').splitlines()
          if revs:
              grep = subprocess.run(
                  ['git', 'grep', '-I', '-n', '-i', '-E', '|'.join(blocked), *revs, '--', '.'],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if grep.returncode == 0:
                  failures.append('tracked contents')
                  print(grep.stdout[:4000])
              elif grep.returncode not in (1,):
                  print(grep.stderr, file=sys.stderr)
                  sys.exit(grep.returncode)

          if failures:
              print('Blocked legacy trace found in: ' + ', '.join(failures), file=sys.stderr)
              sys.exit(1)

          print('No blocked legacy traces found.')
          PY
