<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>UI Text Audit — Clean Control</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 40px;
    font-family: -apple-system, "Apple SD Gothic Neo", "Pretendard", sans-serif;
    background: #f4f5f7;
    color: #222;
  }
  h1 { font-size: 18px; margin-bottom: 24px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  button {
    padding: 8px 16px;
    border-radius: 6px;
    border: none;
    font-size: 14px;
    line-height: 24px;
    cursor: pointer;
  }
  .primary { background: #2563eb; color: white; }
  .secondary { background: #e5e7eb; color: #111827; }
  .ghost { background: transparent; color: #2563eb; border: 1px solid #2563eb; }
  .icon { display: inline-flex; align-items: center; gap: 6px; }
</style>
</head>
<body>
  <h1>UI Text Audit — Clean Control Page</h1>
  <div class="row">
    <button class="primary">저장</button>
    <button class="secondary">취소</button>
    <button class="ghost">자세히 보기</button>
    <button class="primary icon"><span aria-hidden="true">→</span> 다음 단계로</button>
  </div>
</body>
</html>
